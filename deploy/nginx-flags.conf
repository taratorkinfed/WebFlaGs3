# /etc/nginx/sites-available/flags.conf  (symlink into sites-enabled)
# Plain http first; certbot rewrites this file when it adds the certificate.
server {
	listen 80;
	server_name flags.atkinson-lab.com www.flags.atkinson-lab.com;

	client_max_body_size 4m;

	location / {
		include uwsgi_params;
		uwsgi_pass unix:/home/webapp/flags3_web/flags3_web.sock;
		uwsgi_read_timeout 60s;
	}
}
